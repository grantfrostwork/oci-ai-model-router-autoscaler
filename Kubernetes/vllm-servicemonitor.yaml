# vllm-servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [inference]
  selector:
    matchExpressions:
      - {key: tier, operator: In, values: [cpu, gpu]}
  endpoints:
    - port: http
      path: /metrics
      # Match KEDA's five-second polling interval so burst-driven queue growth is
      # visible to the scaler without waiting for a stale 15-second sample.
      interval: 5s
      scrapeTimeout: 3s
