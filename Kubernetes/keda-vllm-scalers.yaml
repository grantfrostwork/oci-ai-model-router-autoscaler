apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm-cpu
  namespace: inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: vllm-cpu
  pollingInterval: 5
  minReplicaCount: 1
  maxReplicaCount: 7
  fallback:
    failureThreshold: 3
    replicas: 1
    behavior: currentReplicasIfHigher
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      name: keda-vllm-cpu
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
            - type: Pods
              value: 3
              periodSeconds: 15
            - type: Percent
              value: 100
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 900
          selectPolicy: Min
          policies:
            - type: Pods
              value: 1
              periodSeconds: 300
  triggers:
    - type: prometheus
      name: queue-depth
      metricType: AverageValue
      useCachedMetrics: true
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        metricName: vllm_cpu_queue_depth
        query: >-
          sum(vllm:num_requests_waiting{namespace="inference",service="vllm-cpu"})
        threshold: "2"
        activationThreshold: "0"
        ignoreNullValues: "false"
    - type: prometheus
      name: kv-cache-pressure
      metricType: Value
      useCachedMetrics: true
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        metricName: vllm_cpu_kv_cache_pressure
        query: >-
          max(vllm:kv_cache_usage_perc{namespace="inference",service="vllm-cpu"})
        threshold: "0.75"
        activationThreshold: "0"
        ignoreNullValues: "false"
    - type: prometheus
      name: queue-time-p95
      metricType: Value
      useCachedMetrics: true
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        metricName: vllm_cpu_queue_time_p95_seconds
        query: >-
          (
            clamp_max(
              histogram_quantile(
                0.95,
                sum by (le) (
                  rate(vllm:request_queue_time_seconds_bucket{namespace="inference",service="vllm-cpu"}[2m])
                )
              ),
              60
            )
            and on ()
            sum(rate(vllm:request_queue_time_seconds_count{namespace="inference",service="vllm-cpu"}[2m])) > 0
          )
          or on ()
          (
            0 * count(vllm:request_queue_time_seconds_count{namespace="inference",service="vllm-cpu"})
          )
        threshold: "2"
        activationThreshold: "0"
        ignoreNullValues: "false"
    - type: prometheus
      name: ttft-p95
      metricType: Value
      useCachedMetrics: true
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        metricName: vllm_cpu_ttft_p95_seconds
        query: >-
          (
            clamp_max(
              histogram_quantile(
                0.95,
                sum by (le) (
                  rate(vllm:time_to_first_token_seconds_bucket{namespace="inference",service="vllm-cpu"}[2m])
                )
              ),
              60
            )
            and on ()
            sum(rate(vllm:time_to_first_token_seconds_count{namespace="inference",service="vllm-cpu"}[2m])) > 0
          )
          or on ()
          (
            0 * count(vllm:time_to_first_token_seconds_count{namespace="inference",service="vllm-cpu"})
          )
        threshold: "5"
        activationThreshold: "0"
        ignoreNullValues: "false"
---
