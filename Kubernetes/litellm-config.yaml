apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: inference
data:
  config.yaml: |
    model_list:
      - model_name: small
        litellm_params:
          model: hosted_vllm/qwen-small
          api_base: http://vllm-cpu.inference.svc.cluster.local:8000/v1
          api_key: none
      - model_name: large
        litellm_params:
          model: hosted_vllm/gpt-oss-20b
          api_base: http://vllm-gpu.inference.svc.cluster.local:8000/v1
          api_key: none
    litellm_settings:
      drop_params: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels: {app: litellm}
  template:
    metadata:
      labels: {app: litellm}
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          args: ["--config", "/config/config.yaml", "--port", "4000"]
          ports: [{containerPort: 4000, name: http}]
          volumeMounts:
            - {name: config, mountPath: /config}
          resources:
            requests: {cpu: "200m", memory: "512Mi"}
            limits:   {cpu: "1",    memory: "2Gi"}
      volumes:
        - name: config
          configMap: {name: litellm-config}
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: inference
spec:
  selector: {app: litellm}
  ports: [{name: http, port: 4000, targetPort: 4000}]
