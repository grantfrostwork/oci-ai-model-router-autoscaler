apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: inference-serving
value: 1000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: High priority for latency-sensitive vLLM model servers.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: capacity-reservation
value: -10
globalDefault: false
preemptionPolicy: Never
description: Low-priority placeholders that maintain one warm node per inference tier.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-nplus-one
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cpu-nplus-one
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cpu-nplus-one
        capacity-role: warm-spare
        tier: cpu
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      priorityClassName: capacity-reservation
      terminationGracePeriodSeconds: 0
      nodeSelector:
        inference-tier: cpu
      tolerations:
        - key: inference-tier
          value: cpu
          effect: NoSchedule
      containers:
        - name: reserve
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: "14", memory: "24Gi"}
            limits: {cpu: "14", memory: "24Gi"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-nplus-one
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-nplus-one
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-nplus-one
        capacity-role: warm-spare
        tier: gpu
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      priorityClassName: capacity-reservation
      terminationGracePeriodSeconds: 0
      nodeSelector:
        inference-tier: gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: inference-tier
          value: gpu
          effect: NoSchedule
      containers:
        - name: reserve
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: "8", memory: "32Gi", nvidia.com/gpu: 1}
            limits: {cpu: "8", memory: "32Gi", nvidia.com/gpu: 1}
