    - "ssh-rsa  ssh-key-2023-11-16"

  # VM.GPU.A10.1 is a fixed shape — no shapeConfigs block
  volumeConfig:
    bootVolumeConfig:
      sizeInGBs: 250
      vpusPerGB: 30
      imageConfig:
        imageType: OKEImage
        imageId: ocid1.image.oc1.iad.aaaaaaaanjrtp77j7in6ygdn5djerfrebjbmnlwm6voggtz764k5sij5er5a
  networkConfig:
    primaryVnicConfig:
      subnetConfig:
        subnetId: ocid1.subnet.oc1.iad.aaaaaaaa3mazjgm7cckbn4rwbmvbc7b4pkgqcyx5i7rr3hymdd5czwqsjbmq
      networkSecurityGroupConfigs:
        - networkSecurityGroupId: ocid1.networksecuritygroup.oc1.iad.aaaaaaaalnbfxoafe2ablh5wtip7m53bku2xqi6bkl7byjwltisfwwciluqq
    secondaryVnicConfigs:
      - subnetConfig:
          subnetId: ocid1.subnet.oc1.iad.aaaaaaaaz5tvr3i32ywlatztrdmwazuqvq6u5flpniysmsxepyurlhqlj27q
        networkSecurityGroupConfigs:
          - networkSecurityGroupId: ocid1.networksecuritygroup.oc1.iad.aaaaaaaa3t7kvspnlaoupz53rx6gs5cskugn46undy5kncdxelmangs5bpjq
        ipCount: 16
  kubeletConfig:
    maxPods: 31
  freeformTags:
    tier: "gpu"
    managed-by: "karpenter"
