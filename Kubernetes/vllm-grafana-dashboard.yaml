apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-inference-autoscaling-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  vllm-inference-autoscaling.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2},
              "min": 0,
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}},
          "targets": [
            {
              "expr": "sum by (service) (vllm:num_requests_waiting{namespace=\"inference\",service=~\"$service\"})",
              "legendFormat": "{{service}} waiting",
              "refId": "A"
            }
          ],
          "title": "Queue depth - primary scaling signal",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "decimals": 1,
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 0.75},
                  {"color": "red", "value": 0.9}
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}},
          "targets": [
            {
              "expr": "max by (service, pod) (vllm:kv_cache_usage_perc{namespace=\"inference\",service=~\"$service\"})",
              "legendFormat": "{{service}} / {{pod}}",
              "refId": "A"
            }
          ],
          "title": "KV-cache pressure - scale at 75%",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2},
              "min": 0,
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 3,
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (service, le) (rate(vllm:time_to_first_token_seconds_bucket{namespace=\"inference\",service=~\"$service\"}[2m])))",
              "legendFormat": "{{service}} p95",
              "refId": "A"
            }
          ],
          "title": "Time to first token (p95, 2m)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2},
              "min": 0,
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "id": 4,
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (service, le) (rate(vllm:request_queue_time_seconds_bucket{namespace=\"inference\",service=~\"$service\"}[2m])))",
              "legendFormat": "{{service}} p95",
              "refId": "A"
            }
          ],
          "title": "Queue wait time (p95, 2m)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2},
              "min": 0,
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "id": 5,
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}},
          "targets": [
            {
              "expr": "sum by (service) (vllm:num_requests_running{namespace=\"inference\",service=~\"$service\"})",
              "legendFormat": "{{service}} running",
              "refId": "A"
            },
            {
              "expr": "sum by (service) (vllm:num_requests_waiting{namespace=\"inference\",service=~\"$service\"})",
              "legendFormat": "{{service}} waiting",
              "refId": "B"
            }
          ],
          "title": "Active and queued requests",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2},
              "min": 0,
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "id": 6,
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}},
          "targets": [
            {
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"inference\",horizontalpodautoscaler=~\"keda-vllm-.*\"}",
              "legendFormat": "{{horizontalpodautoscaler}} current",
              "refId": "A"
            },
            {
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"inference\",horizontalpodautoscaler=~\"keda-vllm-.*\"}",
              "legendFormat": "{{horizontalpodautoscaler}} desired",
              "refId": "B"
            }
          ],
          "title": "KEDA/HPA replicas",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["vllm", "inference", "keda", "autoscaling"],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "label": "Prometheus",
            "name": "DS_PROMETHEUS",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          },
          {
            "allValue": "vllm-.*",
            "current": {"selected": true, "text": "All", "value": "$__all"},
            "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
            "definition": "label_values(vllm:num_requests_waiting{namespace=\"inference\"}, service)",
            "hide": 0,
            "includeAll": true,
            "label": "Service",
            "multi": true,
            "name": "service",
            "options": [],
            "query": {"query": "label_values(vllm:num_requests_waiting{namespace=\"inference\"}, service)", "refId": "VariableQueryEditor-VariableQuery"},
            "refresh": 1,
            "regex": "/vllm-(cpu|gpu)/",
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {"from": "now-30m", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "vLLM Inference Autoscaling",
      "uid": "vllm-inference-autoscaling",
      "version": 1
    }
